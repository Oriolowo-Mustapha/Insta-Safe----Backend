name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore "InstaSafe Backend.slnx"
      - name: Build
        run: dotnet build "InstaSafe Backend.slnx" --no-restore --nologo -v q
      - name: Test
        run: dotnet test "InstaSafe Backend.slnx" --no-build --nologo -v q
